<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact | Mohamed Alson Easa</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<body class="contact-page">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
	<div class="container">
		<a class="navbar-brand" href="index.html">Mohamed Alson Easa</a>

		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="navMenu">
			<ul class="navbar-nav ms-auto">
				<li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
				<li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
				<li class="nav-item"><a href="contact.html" class="nav-link active" aria-current="page">Contact</a></li>
			</ul>

			<button id="themeBtn" class="btn btn-outline-light ms-lg-3 mt-3 mt-lg-0" type="button" aria-label="Toggle dark mode">
				<i class="fas fa-moon" aria-hidden="true"></i>
			</button>
		</div>
	</div>
</nav>

<main>
	<section class="container py-5">
		<div class="row g-5">
			<div class="col-md-5">
				<p class="text-primary fw-semibold mb-2">Get in touch</p>
				<h1 class="mb-3">Contact Me</h1>
				<p class="lead mb-4">Have a question or a project in mind? Send me a message.</p>

				<h2 class="h5 mb-3">Contact Information</h2>
				<p><i class="fas fa-envelope text-primary me-2" aria-hidden="true"></i><strong>Email:</strong> your@email.com</p>
				<p><i class="fas fa-phone text-primary me-2" aria-hidden="true"></i><strong>Phone:</strong> +960 XXXXXXX</p>
				<p><i class="fas fa-location-dot text-primary me-2" aria-hidden="true"></i><strong>Location:</strong> Maldives</p>
			</div>

			<div class="col-md-7">
				<form id="contactForm">
					<div class="mb-3">
						<label for="name" class="form-label">Full Name</label>
						<input type="text" class="form-control" id="name" name="name" autocomplete="name" required>
					</div>

					<div class="mb-3">
						<label for="email" class="form-label">Email Address</label>
						<input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
					</div>

					<div class="mb-3">
						<label for="subject" class="form-label">Subject</label>
						<input type="text" class="form-control" id="subject" name="subject" required>
					</div>

					<div class="mb-3">
						<label for="message" class="form-label">Message</label>
						<textarea id="message" name="message" class="form-control" rows="5" required></textarea>
					</div>

					

					<button type="submit" class="btn btn-primary">
						<i class="fas fa-paper-plane me-2" aria-hidden="true"></i>Send Message
					</button>
					<div id="successMsg" class="mt-3 text-success" role="status" aria-live="polite"></div>
				</form>
			</div>
		</div>
	</section>
</main>

<footer class="bg-dark text-white text-center p-3">
	<p class="mb-0">© 2026 Mohamed Alson Easa</p>
</footer>

<button id="topBtn" type="button" aria-label="Back to top">
	<i class="fas fa-arrow-up" aria-hidden="true"></i>
</button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>

</body>
</html>
